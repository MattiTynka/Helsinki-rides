name: Deploy game to Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'MattiTynka/Helsinki-rides' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
      - name: Fetch only the selected source commit ancestry for the history audit
        shell: bash
        run: |
          git fetch --no-tags --unshallow origin "$GITHUB_SHA"
          git update-ref refs/heads/main "$GITHUB_SHA"
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.2
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Test portable source
        run: pnpm test:source
      - name: Test release tooling
        run: python -m unittest discover -s tools/release/test -p 'test_*.py'
      - name: Audit source and its complete selected ancestry
        run: python tools/release/audit-source-history.py --source-sha "$GITHUB_SHA" --report "$RUNNER_TEMP/source-history-audit.json"
      - name: Validate the committed world descriptor
        run: python tools/release/stage-pages-world.py validate --descriptor content/releases/pages.json --github-env "$GITHUB_ENV"
      - name: Refuse external providers without a served-object verification gate
        if: env.WORLD_DELIVERY_MODE == 'external' && env.WORLD_DELIVERY_PROVIDER != 'github-raw'
        run: python -c "raise SystemExit('External-world publication requires the selected origin and a served-object verification gate. Local packet staging alone cannot activate it.')"
      - name: Build the pinned production game
        env:
          HELSINKI_PAGES_RELEASE: '1'
        run: pnpm build:pages
      - name: Download the pinned public world archive
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --max-redirs 3 --retry 3 --max-time 1200 --max-filesize "$PAGES_WORLD_ARCHIVE_BYTES" "$PAGES_WORLD_ARCHIVE_URL" --output "$RUNNER_TEMP/pages-world.tar.gz"
      - name: Verify every world payload and stage the Pages artifact
        if: env.WORLD_DELIVERY_MODE != 'external'
        run: python tools/release/stage-pages-world.py stage --descriptor content/releases/pages.json --archive "$RUNNER_TEMP/pages-world.tar.gz" --out apps/game/dist-pages --source-sha "$GITHUB_SHA"
      - name: Stage the GitHub raw world separately from the Pages shell
        if: env.WORLD_DELIVERY_PROVIDER == 'github-raw'
        run: python tools/release/stage-pages-world.py stage --descriptor content/releases/pages.json --archive "$RUNNER_TEMP/pages-world.tar.gz" --out apps/game/dist-pages --source-sha "$GITHUB_SHA" --world-out "$RUNNER_TEMP/validated-world"
      - name: Verify every pinned hosted asset before publishing the shell
        if: env.WORLD_DELIVERY_PROVIDER == 'github-raw'
        run: python tools/release/verify-github-raw-world.py --descriptor content/releases/pages.json --world "$RUNNER_TEMP/validated-world/world/$VITE_WORLD_RELEASE" --out "$RUNNER_TEMP/served-world-proof" --shell apps/game/dist-pages
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/game/dist-pages
          retention-days: 1

  deploy:
    needs: build
    if: github.repository == 'MattiTynka/Helsinki-rides' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
